name: Generar audios

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar audios con Google
        run: node scripts/generate-audio.mjs
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      - name: Guardar en el repositorio
        run: |
          git config user.name "LinguaStar bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/audio
          git diff --cached --quiet && echo "Sin cambios" || (git commit -m "Audios generados" && git push)
